      (function () {
        // 1. Ensure window.fetch has a setter so third-party browser extensions (e.g. request interceptors)
        // that assign `window.fetch = ...` do not throw "Cannot set property fetch of #<Window> which has only a getter".
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!winDesc || (winDesc.configurable && !winDesc.set && !winDesc.writable)) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              },
            });
          }
          var protoDesc =
            typeof Window !== 'undefined' && Window.prototype
              ? Object.getOwnPropertyDescriptor(Window.prototype, 'fetch')
              : null;
          if (protoDesc && protoDesc.configurable && !protoDesc.set && !protoDesc.writable) {
            Object.defineProperty(Window.prototype, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              },
            });
          }
        } catch (_e) {
          // Ignore if non-configurable in host environment
        }

        // 2. Suppress uncaught errors originating from third-party browser extensions trying to mutate read-only globals
        window.addEventListener(
          'error',
          function (event) {
            var msg = String((event && event.message) || '');
            var src = String((event && event.filename) || '');
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              src.indexOf('chrome-extension://') === 0 ||
              src.indexOf('moz-extension://') === 0
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reasonMsg = String(
              (event && event.reason && (event.reason.message || event.reason.stack || event.reason)) || ''
            );
            if (
              reasonMsg.indexOf('Cannot set property fetch') !== -1 ||
              reasonMsg.indexOf('chrome-extension://') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
